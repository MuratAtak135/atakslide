<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Layout 6: Section Break</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;800&display=swap');
        :root { --accent: #38BDF8; }
        body { font-family: 'Inter', sans-serif; background: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }

        .slide-container {
            width: 1280px; height: 720px; position: relative; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5); display: flex; align-items: center;
        }

        /* Arka Plan Görseli */
        .bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://picsum.photos/1280/720');
            background-size: cover; background-position: center; filter: brightness(0.4);
            z-index: 0;
        }

        /* İçerik */
        .content { z-index: 1; position: relative; width: 100%; padding: 0 100px; display: flex; justify-content: space-between; align-items: center; }

        .left-side { border-left: 8px solid var(--accent); padding-left: 40px; }
        .section-tag { color: var(--accent); font-size: 18px; letter-spacing: 4px; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 20px; }
        .section-title { font-size: 80px; color: white; font-weight: 800; line-height: 1; margin: 0; }

        .right-side { text-align: right; }
        .section-num { font-size: 150px; color: rgba(255,255,255,0.1); font-weight: 800; line-height: 1; }

        [contenteditable]:focus { outline: none; background: rgba(255,255,255,0.1); }
        .toolbar { position: absolute; top: 20px; right: 20px; z-index: 999; display: flex; gap: 10px; }
        .btn { background: #444; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn" onclick="setTheme('#38BDF8')">Mavi</button>
    <button class="btn" onclick="setTheme('#EA580C')">Turuncu</button>
    <button class="btn" onclick="setTheme('#F43F5E')">Kırmızı</button>
</div>

<div class="slide-container">
    <div class="bg-image"></div>

    <div class="content">
        <div class="left-side">
            <span class="section-tag" contenteditable="true">BÖLÜM 03</span>
            <h1 class="section-title" contenteditable="true">Pazar<br>Analizi</h1>
        </div>

        <div class="right-side">
            <div class="section-num" contenteditable="true">03</div>
        </div>
    </div>
</div>

<script>
    function setTheme(color) { document.documentElement.style.setProperty('--accent', color); }
</script>
</body>
</html>
