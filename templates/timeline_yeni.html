<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 1: Timeline (Final Structured)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap');

        :root {
            --bg-color: #0F172A; --card-bg: #1E293B; --text-primary: #F1F5F9; --text-secondary: #94A3B8;
            --accent-color: #38BDF8; --line-color: #334155; --selection-color: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { font-family: 'Inter', sans-serif; background-color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }

        .slide-container { width: 1280px; height: 720px; background-color: var(--bg-color); position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 60px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }

        /* HEADER */
        .header { height: 15%; margin-bottom: 20px; border-left: 5px solid var(--accent-color); padding-left: 20px; }
        .tag { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-color); font-weight: 800; display: block; margin-bottom: 10px; }
        h1 { font-size: 42px; font-weight: 600; margin: 0; color: var(--text-primary); }

        /* TIMELINE ALANI */
        .timeline-wrapper { position: relative; flex-grow: 1; display: flex; align-items: center; }

        /* ÇİZGİ (SABİT) */
        .timeline-line {
            position: absolute; top: 50%; left: 0; width: 100%; height: 4px;
            background-color: var(--line-color); transform: translateY(-50%); z-index: 0; border-radius: 2px;
        }

        .steps-container {
            display: flex; justify-content: space-between; width: 100%; height: 100%; position: relative; z-index: 1;
        }

        .step-item {
            position: relative; flex: 1; /* Eşit dağıl */ min-width: 150px; height: 100%; padding: 0 10px;
            display: flex; flex-direction: column; justify-content: center;
        }

        /* NOKTA */
        .step-dot {
            width: 24px; height: 24px; background-color: var(--bg-color);
            border: 4px solid var(--accent-color); border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
        }

        /* KART */
        .step-card {
            position: absolute; left: 10px; right: 10px;
            background-color: var(--card-bg); padding: 25px; border-radius: 12px;
            border: 1px solid rgba(255,255,255, 0.05); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s; cursor: pointer;
        }
        .step-card:hover { border: 1px solid var(--accent-color); }
        .step-card.selected-element { border: 2px solid var(--selection-color); }

        /* Zikzak Mantığı */
        .step-item:nth-child(odd) .step-card { bottom: 50%; margin-bottom: 40px; }
        .step-item:nth-child(even) .step-card { top: 50%; margin-top: 40px; }

        .step-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; color: var(--text-primary); }
        .step-desc { font-size: 14px; line-height: 1.5; color: var(--text-secondary); }

        [contenteditable="true"]:hover { background: rgba(255,255,255,0.1); cursor: text; border-radius: 4px; }
        .editor-tools { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 999; }
        .tool-btn { background: #444; color: #fff; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="editor-tools">
        <button class="tool-btn" onclick="addStep()">+ Adım Ekle</button>
        <button class="tool-btn" onclick="setTheme('#38BDF8')">Mavi</button>
        <button class="tool-btn" onclick="setTheme('#10B981')">Yeşil</button>
    </div>

    <div class="slide-container">
        <div class="header">
            <span class="tag" contenteditable="true">Proje Yol Haritası</span>
            <h1 contenteditable="true">Geliştirme Süreci</h1>
        </div>

        <div class="timeline-wrapper">
            <div class="timeline-line"></div>
            <div class="steps-container" id="stepsContainer">
                <div class="step-item">
                    <div class="step-card" onclick="selectEl(this)">
                        <h3 class="step-title" contenteditable="true">Veri Analizi</h3>
                        <p class="step-desc" contenteditable="true">Mevcut verilerin toplanması.</p>
                    </div>
                    <div class="step-dot"></div>
                </div>
                <div class="step-item">
                    <div class="step-card" onclick="selectEl(this)">
                        <h3 class="step-title" contenteditable="true">Modelleme</h3>
                        <p class="step-desc" contenteditable="true">Algoritma kurgusu.</p>
                    </div>
                    <div class="step-dot"></div>
                </div>
                <div class="step-item">
                    <div class="step-card" onclick="selectEl(this)">
                        <h3 class="step-title" contenteditable="true">Simülasyon</h3>
                        <p class="step-desc" contenteditable="true">Test ortamında doğrulama.</p>
                    </div>
                    <div class="step-dot"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setTheme(color) { document.documentElement.style.setProperty('--accent-color', color); }

        function addStep() {
            const container = document.getElementById('stepsContainer');
            // Maksimum 5-6 adım sığar, sonrasını engellemek iyi olabilir ama serbest bırakıyoruz
            const newStep = document.createElement('div');
            newStep.className = 'step-item';
            newStep.innerHTML = `
                <div class="step-card" onclick="selectEl(this)">
                    <h3 class="step-title" contenteditable="true">Yeni Adım</h3>
                    <p class="step-desc" contenteditable="true">Açıklama.</p>
                </div>
                <div class="step-dot"></div>`;
            container.appendChild(newStep);
        }

        let selected = null;
        function selectEl(el) {
            if (selected) selected.classList.remove('selected-element');
            selected = el;
            selected.classList.add('selected-element');
        }

        document.addEventListener('click', (e) => {
            if (selected && !e.target.closest('.step-card') && !e.target.closest('.editor-tools')) {
                selected.classList.remove('selected-element');
                selected = null;
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
                if (!document.activeElement.isContentEditable) {
                    // Step-item'ı (üst divi) silmemiz lazım
                    selected.parentElement.remove();
                    selected = null;
                }
            }
        });
    </script>
</body>
</html>
